<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600&family=Instrument+Sans:wght@600;700&display=swap">

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>

</head>
<body>
  <main class="page">

    <div class="scoreboard">
      <div class="score-box">
        <span class="score-label">You</span>
        <Span id="score-you" class="score-value">0</Span>
      </div>
      <div class="score-box">
        <span class="score-label">Draws</span>
        <Span id="score-draws" class="score-value">0</Span>
      </div>
      <div class="score-box">
        <span class="score-label">CPU</span>
        <Span id="score-cpu" class="score-value">0</Span>
      </div>
    </div>

    <div class="viewfinder">
      <video id="webcam" autoplay muted playsinline></video>

      <div id="countdown-overlay" class="countdown-overlay hidden">
        <span id="countdown-number" class="countdown-number"></span>
      </div>
      
    </div>

    <div id="confidence-bars" class="confidence-bars"></div>
    <p id="status" class="status">Loading Model...</p>

    <button id="play-btn" class="play-btn" disabled>Play A Stupid Round</button>></button>

    <p id="cpu-move" class="cpu-move"></p>
    <p id="result" class="result"></p>

  </main>

 <script src="script.js"></script>

</body>
</html>
